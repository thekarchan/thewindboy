<link rel="stylesheet" href="{{ "css/custom.css" | relURL }}">
<link rel="alternate" type="application/rss+xml" title="RSS (全部文章)" href="{{ "rss.xml" | relURL }}">
<link rel="alternate" type="application/rss+xml" title="RSS (近期更新)" href="{{ "latest/index.xml" | relURL }}">
{{ with .OutputFormats.Get "MARKDOWN" }}
<link rel="alternate" type="text/markdown" title="{{ $.Title }} (Markdown)" href="{{ replace .Permalink "/index.md" ".md" }}">
{{ end }}
